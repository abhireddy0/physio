services:
  - type: web
    name: physio-reviews
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: physio
      - key: REVIEWS_ADMIN_PASSWORD
        sync: false
      - key: VITE_SITE_URL
        sync: false
